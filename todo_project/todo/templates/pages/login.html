{% extends "base.html" %}

{% block title %}Đăng nhập{% endblock %}

{% block content %}
<h3>Đăng nhập</h3>
<form method="post">
    {% csrf_token %}
    {% if form.non_field_errors %}<p><mark>{{ form.non_field_errors|join:" " }}</mark></p>{% endif %}
    <p><label for="{{ form.username.id_for_label }}">Tài khoản:</label>{{ form.username }}</p>
    <p><label for="{{ form.password.id_for_label }}">Mật khẩu:</label>{{ form.password }}</p>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Đăng nhập</button>
    <a class="button" href="{% url 'register' %}">Đăng ký</a>
</form>
{% endblock %}
