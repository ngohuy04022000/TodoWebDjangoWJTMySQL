{% extends "base.html" %}

{% block title %}Đăng ký{% endblock %}

{% block content %}
<h3>Đăng ký tài khoản</h3>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Đăng ký</button>
    <a class="button" href="{% url 'login' %}">Đã có tài khoản? Đăng nhập</a>
</form>
{% endblock %}
