{% extends "base.html" %}

{% block content %}
<h3>Xóa danh sách</h3>
<p>Bạn có muốn xóa danh sách <i>{{ object.title }}</i> cùng toàn bộ công việc trong đó?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Vâng, hãy xóa nó</button>
    <a class="button" href="{% url 'list' object.id %}">Hủy bỏ</a>
</form>
{% endblock %}
