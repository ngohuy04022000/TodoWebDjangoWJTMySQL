{% extends "base.html" %}

{% block content %}
<h3>Xóa công việc</h3>
<p>Bạn có muốn xóa công việc <b>{{ object.task }}</b> của danh sách <i>{{ todo_list.title }}</i>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Vâng, hãy xóa nó</button>
    <a class="button" href="{% url 'list' todo_list.id %}">Hủy bỏ</a>
</form>
{% endblock %}
