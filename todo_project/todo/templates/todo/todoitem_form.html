{% extends "base.html" %}

{% block content %}
<h3>{{ title }}</h3>
<p>Danh sách: <i>{{ todo_list.title }}</i></p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Lưu</button>
    <a class="button" href="{% url 'list' todo_list.id %}">Hủy bỏ</a>
    {% if object %}
    <a class="button" href="{% url 'item-delete' todo_list.id object.id %}">Xóa công việc này</a>
    {% endif %}
</form>
{% endblock %}
