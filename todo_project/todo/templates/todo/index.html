{% extends "base.html" %}

{% block content %}
<h3>Danh sách công việc của bạn</h3>
<ul>
    {% for todolist in object_list %}
    <li><a href="{% url 'list' todolist.id %}">{{ todolist.title }}</a></li>
    {% empty %}
    <p>Bạn chưa có danh sách công việc nào.</p>
    {% endfor %}
</ul>
<p><a class="button" href="{% url 'list-add' %}">Thêm danh sách mới</a></p>
{% endblock %}
